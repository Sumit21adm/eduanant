server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;                 # so caches keep gzipped and plain copies apart
    gzip_min_length 512;          # below this the header costs more than it saves
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/xml+rss
        application/manifest+json image/svg+xml;
    # Note: WebP, PNG and PDF are already compressed — gzipping them wastes CPU
    # for no gain, so they are deliberately absent above.

    # ── Routing ──────────────────────────────────────────────────────────────
    # Prerendered routes live at /<route>/index.html, so $uri/ finds them before
    # the SPA fallback is reached. That is what lets crawlers get real HTML.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML is rebuilt on every deploy and is not fingerprinted, so it must never
    # be held by a cache — otherwise a visitor keeps yesterday's prerender and
    # references asset hashes that no longer exist.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Crawler files change with content, not with a build hash.
    location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Fingerprinted assets can be cached forever. webp/avif/pdf were missing
    # before, so the screenshots and the profile PDF were re-fetched every visit.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|pdf|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
