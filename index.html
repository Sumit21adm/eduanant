    <script>
      // Applied before first paint so dark-mode users never see a white flash.
      // Must stay in sync with ThemeContext: an explicit choice wins,
      // otherwise follow the device's prefers-color-scheme.
      (function () {
        try {
          var saved = localStorage.getItem('app-dark-mode');
          var dark = saved !== null
            ? saved === 'true'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          var t = localStorage.getItem('app-color-theme');
          if (t && t !== 'default') document.documentElement.classList.add('theme-' + t);
        } catch (e) {}
      })();
    </script>

    <!-- Baseline structured data. Per-page JSON-LD is injected by src/lib/seo.tsx

         the floor, so even an un-prerendered deploy identifies the product. -->
